<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>驾驶实验事件记录</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:#172b40;font-family:system-ui,-apple-system,sans-serif;padding:24px; padding-top:max(24px,env(safe-area-inset-top))}main{max-width:1050px;margin:auto}h1{font-size:28px;margin:0 0 8px}.sub{color:#53677c;line-height:1.6}section{background:white;border:1px solid #dce4ec;border-radius:16px;padding:20px;margin-top:20px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center}label{display:flex;align-items:center;gap:8px}input{width:150px;padding:12px;border:1px solid #bbc8d5;border-radius:8px;font:inherit}button{font:inherit;cursor:pointer;border:1px solid #bbcad8;border-radius:9px;padding:12px 18px;background:white;color:#172b40;touch-action:manipulation}button:disabled{opacity:.35;cursor:default}.events{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.event{padding:24px 12px;text-align:left;min-height:125px;background:#edf4fc;border:2px solid #c9dcef}.event strong{display:block;font-size:21px;margin:12px 0 6px}.event small{font-size:14px}.event.next{border-color:#1c65ae;background:#e2f0ff}.event.done{background:#eef8f2;border-color:#b8dcc5}#tor{background:#fff0ed;border-color:#d88b7d}#takeover{background:#e8f7f0;border-color:#70b798}#live{font-size:22px;font-variant-numeric:tabular-nums;margin:14px 0}#status{min-height:24px;font-weight:600}#audioStatus{color:#765300}.table-wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}th,td{padding:12px 10px;border-bottom:1px solid #e1e7ee;text-align:left}th{color:#52677e}#reaction{font-size:22px;color:#176745;margin-top:16px}.note{font-size:13px;color:#53677c;line-height:1.6}@media(max-width:650px){body{padding:12px}.events{grid-template-columns:1fr 1fr}.event strong{font-size:18px}h1{font-size:23px}}
</style>
</head>
<body><main>
<h1>驾驶实验 · 事件时间记录</h1>
<div class="sub">点击标记五个关键事件。时间按 America/Toronto 记录，自动处理夏令时。</div>
<section>
<div class="toolbar"><label>参与者 ID <input id="participant" value="P001" maxlength="80"></label><label>场景 ID <input id="scenario" value="S01" maxlength="80"></label><button id="testSound">测试警报</button><button id="mute">停止警报</button></div>
<div id="live"></div><div id="status" role="status" aria-live="polite">准备就绪，点击“场景开始”。</div><div id="audioStatus" role="status"></div>
</section>
<section><div class="events">
<button class="event" id="scene_start"><span>01</span><strong>场景开始</strong><small>Scene start</small></button>
<button class="event" id="cruise_control"><span>02</span><strong>启动 Cruise Control</strong><small>巡航控制启动</small></button>
<button class="event" id="autopilot"><span>03</span><strong>启动 Autopilot</strong><small>自动驾驶启动</small></button>
<button class="event" id="tor"><span>04 · 声音警报</span><strong>TOR</strong><small>发出接管请求</small></button>
<button class="event" id="takeover"><span>05</span><strong>Takeover</strong><small>接管标记 · 停止警报</small></button>
</div><div id="reaction"></div></section>
<section><div class="toolbar"><button id="export" disabled>导出全部记录 CSV</button><button id="newScene" disabled>下一场景</button></div>
<div class="table-wrap"><table><thead><tr><th>场景</th><th>事件</th><th>Toronto 时间</th><th>距场景开始 / s</th></tr></thead><tbody id="log"></tbody></table></div>
<p class="note">这里记录的是实验人员点击按钮的时间。TOR 时间是按钮点击时刻；声音实际播放和被听到可能存在延迟。Takeover 间隔为两次人工标记的时间差。请在实验结束后导出 CSV。</p>
</section></main>
<script>
'use strict';
const STEPS=['scene_start','cruise_control','autopilot','tor','takeover'];
const LABELS={scene_start:'场景开始',cruise_control:'启动 Cruise Control',autopilot:'启动 Autopilot',tor:'TOR',takeover:'Takeover'};
const el=id=>document.getElementById(id);
const fmt=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Toronto',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
function torontoTimestamp(date=new Date()){const p={};for(const part of fmt.formatToParts(date))p[part.type]=part.value;return `${p.year}-${p.month}-${p.day} ${p.hour}:${p.minute}:${p.second}.${String(date.getUTCMilliseconds()).padStart(3,'0')}`;}
function clock(){const perf=performance.now(),date=new Date();return {perf,date};}
let rows=[],step=0,scene=null,audio=null,alarmTimer=null,testTimer=null,voices=[],audioGeneration=0;
const runId=Date.now()+'-'+Math.random().toString(36).slice(2,8);
function update(){el('testSound').disabled=step>0;STEPS.forEach((id,i)=>{el(id).disabled=i!==step;el(id).className='event'+(i<step?' done':i===step?' next':'');});el('export').disabled=!rows.length;el('newScene').disabled=step===0;el('participant').disabled=step>0;el('scenario').disabled=step>0;}
function beep(){
  if(!audio||audio.state!=='running')return;
  const osc=audio.createOscillator(),gain=audio.createGain(),t=audio.currentTime;
  osc.type='sine';osc.frequency.setValueAtTime(880,t);gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(.15,t+.015);gain.gain.setValueAtTime(.15,t+.22);gain.gain.linearRampToValueAtTime(0,t+.25);
  osc.connect(gain);gain.connect(audio.destination);voices.push(osc);osc.onended=()=>{voices=voices.filter(v=>v!==osc);osc.disconnect();gain.disconnect();};osc.start(t);osc.stop(t+.26);
}
function stopAlarm(){audioGeneration++;clearInterval(alarmTimer);alarmTimer=null;clearTimeout(testTimer);testTimer=null;for(const v of voices){try{v.stop();}catch(_){}}voices=[];}
async function startAlarm(){
  stopAlarm();const generation=audioGeneration;
  try{
    const AudioCtor=window.AudioContext||window.webkitAudioContext;if(!AudioCtor)throw new Error('此浏览器不支持网页音频');
    if(!audio)audio=new AudioCtor();await audio.resume();
    // Takeover may have been marked while the audio context was resuming.
    if(generation!==audioGeneration)return;
    if(audio.state!=='running')throw new Error('音频未启动');
    beep();alarmTimer=setInterval(beep,600);el('audioStatus').textContent='警报已启动；请确认设备音量。';
  }catch(error){el('audioStatus').textContent='警报未能启动：'+error.message+'。事件时间仍已记录。';}
}
function record(id){
  if(STEPS[step]!==id)return;
  const stamp=clock();
  if(id==='scene_start'){
    const participant=el('participant').value.trim(),scenario=el('scenario').value.trim();
    if(!participant||!scenario){el('status').textContent='请填写参与者 ID 和场景 ID。';return;}
    scene={participant,scenario,key:Date.now()+'-'+Math.random().toString(36).slice(2,8),start:stamp.perf,tor:null};el('reaction').textContent='';el('audioStatus').textContent='';
  }
  if(id==='tor')scene.tor=stamp.perf;
  const interval=id==='takeover'?stamp.perf-scene.tor:'';
  rows.push({run_id:runId,scene_instance_id:scene.key,participant_id:scene.participant,scenario_id:scene.scenario,event:id,event_label:LABELS[id],timestamp_toronto:torontoTimestamp(stamp.date),timestamp_utc:stamp.date.toISOString(),epoch_ms:stamp.date.getTime(),performance_ms:stamp.perf.toFixed(3),performance_time_origin_ms:performance.timeOrigin,elapsed_scene_ms:(stamp.perf-scene.start).toFixed(3),tor_to_takeover_marker_ms:interval===''?'':interval.toFixed(3),timezone:'America/Toronto'});
  const row=rows[rows.length-1],tr=document.createElement('tr');for(const value of [row.scenario_id,row.event_label,row.timestamp_toronto,(Number(row.elapsed_scene_ms)/1000).toFixed(3)]){const td=document.createElement('td');td.textContent=value;tr.appendChild(td);}el('log').appendChild(tr);
  step++;update();el('status').textContent=step===5?'本场景记录完成。可导出 CSV 或进入下一场景。':`已记录：${LABELS[id]}。下一步：${LABELS[STEPS[step]]}。`;
  if(id==='tor')startAlarm();
  if(id==='takeover'){stopAlarm();el('audioStatus').textContent='警报已停止。';el('reaction').textContent=`TOR → Takeover 标记间隔：${interval.toFixed(1)} ms（${(interval/1000).toFixed(3)} s）`;}
}
STEPS.forEach(id=>el(id).addEventListener('click',()=>record(id)));
el('testSound').addEventListener('click',async()=>{if(alarmTimer){el('audioStatus').textContent='警报正在播放。';return;}await startAlarm();testTimer=setTimeout(()=>{stopAlarm();el('audioStatus').textContent='测试结束。';},1800);});
el('mute').addEventListener('click',()=>{stopAlarm();el('audioStatus').textContent='警报已手动停止，未记录 Takeover。';});
el('newScene').addEventListener('click',()=>{
  if(step<5&&!confirm('当前场景尚未完成，仍要进入下一场景吗？已有记录会保留。'))return;
  stopAlarm();step=0;scene=null;const match=el('scenario').value.match(/^(.*?)(\d+)$/);if(match)el('scenario').value=match[1]+String(Number(match[2])+1).padStart(match[2].length,'0');el('status').textContent='准备就绪，点击“场景开始”。';el('reaction').textContent='';el('audioStatus').textContent='';update();
});
const columns=['run_id','scene_instance_id','participant_id','scenario_id','event','event_label','timestamp_toronto','timestamp_utc','epoch_ms','performance_ms','performance_time_origin_ms','elapsed_scene_ms','tor_to_takeover_marker_ms','timezone'];
function csvCell(value){return '"'+String(value??'').replace(/"/g,'""')+'"';}
function csvText(){return '\uFEFF'+[columns.map(csvCell).join(','),...rows.map(r=>columns.map(k=>csvCell(r[k])).join(','))].join('\r\n');}
el('export').addEventListener('click',()=>{const url=URL.createObjectURL(new Blob([csvText()],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='Driving_Events_'+runId+'.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);});
function tick(){el('live').textContent=torontoTimestamp();}tick();setInterval(tick,100);
window.addEventListener('pagehide',stopAlarm);
window.addEventListener('beforeunload',event=>{if(rows.length){event.preventDefault();event.returnValue='';}});
update();
</script></body></html>
